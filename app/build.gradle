plugins { id 'com.android.application' }

dependencies { implementation 'org.conscrypt:conscrypt-android:2.5.3'; implementation project(':runtime'); implementation files('libs/hiddenapibypass-6.1.aar') }

android {
    namespace 'cn.hydrogen.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'cn.windchaser.unified'
        minSdk 17
        targetSdk 24
        ndk { abiFilters 'armeabi-v7a' }
        versionCode 12
        versionName '1.0.1'
        testInstrumentationRunner 'cn.hydrogen.launcher.SmokeInstrumentation'
    }
    buildTypes {
        release { minifyEnabled false; debuggable false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    sourceSets { main { assets.srcDir 'src/main/unifiedAssets'; java.srcDir '../experiments/map-motion/src'; java.srcDir '../experiments/startup-ui/src' }; androidTest { java.srcDir '../experiments/map-motion/src'; java.srcDir '../experiments/amap65-bridge/src'; java.srcDir '../experiments/dual-splash/src' } }
    lint { abortOnError true; disable 'ExpiredTargetSdkVersion', 'OldTargetApi', 'ObsoleteSdkInt' }
}

// Test-only compile stubs. KitKat supplies MockPackageManager in its framework.
dependencies { androidTestCompileOnly files(androidComponents.sdkComponents.sdkDirectory.map { it.file('platforms/android-35/optional/android.test.mock.jar') }) }

