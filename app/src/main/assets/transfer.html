<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>追风桌面 · 文件传输</title>
<style>
:root{color-scheme:dark;font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif;color:#e5f0f8;background:#081421}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-height:100vh;padding:24px 14px 48px;background:linear-gradient(#08142188,#081421ee),url(/background) center/cover fixed}main{max-width:760px;margin:auto;min-width:0}.brand{font-size:12px;letter-spacing:3px;color:#9cb4c7;margin:14px 4px}h1{font-size:28px;line-height:1.3;margin:4px 0 12px}h2{font-size:18px;margin:0}p{color:#a8bfce;margin:8px 0}.panel{min-width:0;margin:18px 0;padding:22px;border:1px solid #7795a632;border-radius:22px;background:#0c2030e6;box-shadow:0 12px 40px #0002}.badge{display:inline-block;border:1px solid #6ed6bc3d;background:#3cc6a516;color:#b8e5d8;padding:3px 10px;border-radius:30px;font-size:12px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0 14px}button,.choose{appearance:none;border:1px solid #8db2c33b;display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:10px 18px;border-radius:12px;background:#284657;color:#dfedf5;font:600 14px system-ui;cursor:pointer;text-align:center}button.primary{background:#a9e6d0;color:#102d33;border:0;flex:1;min-width:120px}button:disabled,.disabled{opacity:.45;cursor:default}.small{min-height:36px;padding:6px 12px;font-size:12px}input[type=file]{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden}.help{font-size:12px;overflow-wrap:anywhere}.summary{color:#c1d5df;font-size:13px;min-height:26px}.queue{max-height:55vh;overflow:auto;overscroll-behavior:contain;padding:0;list-style:none;margin:0}.item{min-width:0;padding:14px 0;border-top:1px solid #9cc8df19}.line{display:flex;align-items:center;gap:12px;min-width:0}.name{min-width:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;color:#e5eef5}.meta{font-size:12px;color:#9bb4c4;flex-shrink:0}.status{font-size:12px;color:#9cb8cb;margin-top:5px}.error .status{color:#ffaea4}.done .status{color:#a9e6d0}progress{width:100%;height:6px;display:block;appearance:none;border:0;border-radius:5px;overflow:hidden;background:#1d394b;margin:10px 0 0}progress::-webkit-progress-bar{background:#1d394b;border-radius:5px}progress::-webkit-progress-value{background:#a9e6d0;border-radius:5px}progress::-moz-progress-bar{background:#a9e6d0}.files{list-style:none;margin:14px 0 0;padding:0}.files li{min-width:0;display:flex;align-items:center;gap:12px;border-top:1px solid #9cc8df19;padding:13px 0}.files a{min-width:0;flex:1;display:block;color:#cce7f2;white-space:nowrap;text-overflow:ellipsis;overflow:hidden;text-decoration:none}.section{display:flex;align-items:center;gap:10px;justify-content:space-between}.empty{color:#7798ae;font-size:13px}footer{text-align:center;color:#6f91a5;font-size:12px;margin-top:24px}@media(max-width:420px){body{padding:16px 12px 32px}.panel{padding:18px;border-radius:18px}h1{font-size:25px}.toolbar{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.toolbar button,.toolbar .choose{min-width:0;width:100%;padding:10px 8px;white-space:nowrap;font-size:13px}.panel p{font-size:13px}}@media(prefers-reduced-motion:no-preference){progress{transition:all .12s}}

/* Keep selection and upload actions in separate, stable rows on narrow phones. */
.toolbar{display:block;margin:22px 0 16px}.pickers,.actions{display:flex;align-items:stretch;gap:10px}.actions{margin-top:12px;padding-top:12px;border-top:1px solid #a0c5d51c}.pickers .choose{flex:1;min-width:0}.pickers .choose[hidden]{display:none}
button,.choose{gap:8px;min-height:50px;padding:12px 14px;border:1px solid #a4cbdb36;border-radius:14px;background:linear-gradient(145deg,#abcfe01c,#81a9c50b);box-shadow:inset 0 1px 0 #ffffff0c;color:#e0edf5;font:600 14px/1.3 system-ui,-apple-system,"Segoe UI",sans-serif;white-space:nowrap;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button svg,.choose svg{display:block;width:19px;height:19px;flex-shrink:0}.choose svg{color:#a9e6d0}.actions .primary{flex:1;min-width:0;min-height:52px;background:linear-gradient(135deg,#b7eedc,#8cd4c2);color:#113630;border:1px solid #bdf2e166;box-shadow:0 5px 16px #52c6a817,inset 0 1px 0 #ffffff45;font-weight:700}.actions .quiet{flex:none;background:transparent;color:#adc1ce;box-shadow:none;border-color:transparent;font-size:12px;padding-left:10px;padding-right:0}.quiet svg{width:16px;height:16px}.retry{width:100%;margin-top:10px;border-color:#edc79242;background:#edc7920c;color:#e9cfaa;font-size:13px}
button:disabled,.disabled{opacity:1;color:#7c949e;border-color:#7da3ab21;background:#86c1b00d;box-shadow:none;cursor:default}.actions .primary:disabled{color:#7faaa1;background:#a9e6d012;border-color:#a9e6d028;box-shadow:none}.actions .quiet:disabled{color:#667d8b;background:transparent;border-color:transparent}.small{min-height:36px;padding:7px 12px;border-radius:11px;font-size:12px;gap:6px}.small svg{width:15px;height:15px}.remove{margin-top:8px;min-height:32px;padding:5px 12px;border-radius:9px;background:#8aaabc0b;border-color:#8aaabc24;color:#a3bdcc;font-size:12px;box-shadow:none}
button:focus-visible,.choose:focus-within{outline:2px solid #b2e9d9;outline-offset:3px}button:not(:disabled):active,.choose:not(.disabled):active{transform:translateY(1px);filter:brightness(1.12)}
@media(hover:hover){button:not(:disabled):hover,.choose:not(.disabled):hover{border-color:#a9e6d073;filter:brightness(1.08)}}
@media(max-width:420px){.toolbar{display:block}.toolbar button,.toolbar .choose{width:auto;min-width:0;padding:12px 10px;font-size:13px}.pickers,.actions{gap:8px}.pickers .choose{width:0}.actions .quiet{font-size:12px;padding-right:0;padding-left:4px;gap:5px}.actions .quiet svg{width:15px;height:15px}.toolbar .retry{width:100%}}
@media(prefers-reduced-motion:no-preference){button,.choose{transition:background .12s,border-color .12s,transform .12s}}
</style></head><body><main><div class="brand">WINDCHASER · MarLous</div><section class="panel"><span class="badge">已连接车机</span><h1>把文件带上车</h1><p>一次上传最多 200 个文件，每个文件最大 300 MB。</p><div class="toolbar"><div class="pickers"><label class="choose" for="files" id="choose"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 14h8M8 17h5"/></svg><span>添加文件</span></label><input id="files" type="file" multiple="multiple" accept="*/*"><label class="choose" for="folder" id="chooseFolder" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M3 11h18"/></svg><span>添加文件夹</span></label><input id="folder" type="file" webkitdirectory multiple="multiple" hidden></div><div class="actions"><button id="send" class="primary" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V3m-5 5 5-5 5 5M4 15v4a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-4"/></svg><span>开始上传</span></button><button id="clear" class="quiet" disabled><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2M5 6l1 14h12l1-14M10 10v6m4-6v6"/></svg><span>清空队列</span></button></div><button id="retry" class="retry" hidden><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11.5-2L20 8M4 16l2.5 3A7 7 0 0 0 18 17"/></svg><span>重试失败文件</span></button></div><div id="state" class="summary" role="status" aria-live="polite">可一次多选，也可反复添加；已选文件会保留。</div><ol id="queue" class="queue"></ol><p class="help">在手机文件选择器中长按文件可尝试多选；若只支持单选，返回本页后继续点「添加文件」，可累计 200 个。支持文件夹选择的浏览器也可点「添加文件夹」批量加入文件，均保存到同一接收目录。<br>接收位置：Download / WindChaserTransfer<br>重名文件自动编号。请保持此页面和车机传输服务开启。</p></section><section class="panel"><div class="section"><h2>车机接收目录</h2><button id="refresh" class="small"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 11.5-2L20 8M4 16l2.5 3A7 7 0 0 0 18 17"/></svg><span>刷新</span></button></div><ul id="list" class="files"></ul></section><footer>追风桌面 · 文件传输</footer></main>
<script>
(function(){'use strict';var $=function(id){return document.getElementById(id)},input=$('files'),state=$('state'),send=$('send'),retry=$('retry'),queue=$('queue'),list=$('list'),items=[],running=false;
function size(n){return n>=1048576?(n/1048576).toFixed(1)+' MB':Math.ceil(n/1024)+' KB'}
function load(){var x=new XMLHttpRequest();x.open('GET','/list');x.onload=function(){if(x.status!==200){state.textContent='连接已失效，请刷新页面重新连接';return}try{var data=JSON.parse(x.responseText);list.textContent='';data.forEach(function(f){var li=document.createElement('li'),a=document.createElement('a'),meta=document.createElement('span');a.textContent=f.name;a.title=f.name;a.href='/file?name='+encodeURIComponent(f.name);meta.textContent=f.size;meta.className='meta';li.appendChild(a);li.appendChild(meta);list.appendChild(li)});if(!data.length){var e=document.createElement('li');e.textContent='接收目录暂无文件';e.className='empty';list.appendChild(e)}}catch(e){state.textContent='目录读取失败，请重试'}};x.onerror=function(){state.textContent='无法连接车机，请检查热点'};x.send()}
function mark(item,text,kind){item.status.textContent=text;item.row.className='item '+(kind||'')}
function append(files){var remaining=200-items.length,selected=Array.prototype.slice.call(files),overflow=selected.length>remaining;selected=selected.slice(0,remaining);selected.forEach(function(f){var row=document.createElement('li'),line=document.createElement('div'),name=document.createElement('span'),meta=document.createElement('span'),status=document.createElement('div'),progress=document.createElement('progress');line.className='line';name.className='name';name.textContent=f.name;name.title=f.name;meta.className='meta';meta.textContent=size(f.size);status.className='status';progress.max=100;progress.value=0;progress.setAttribute('aria-label',f.name+' 上传进度');line.appendChild(name);line.appendChild(meta);row.appendChild(line);row.appendChild(progress);row.appendChild(status);queue.appendChild(row);var item={file:f,row:row,status:status,bar:progress,done:false,invalid:f.size>314572800};items.push(item);var remove=document.createElement('button');remove.className='small remove';remove.textContent='移除';remove.setAttribute('aria-label','移除 '+f.name);remove.onclick=function(){if(running)return;items.splice(items.indexOf(item),1);row.remove();send.disabled=!items.some(function(i){return !i.invalid&&!i.done});$('clear').disabled=!items.length;state.textContent='已加入 '+items.length+' / 200 个文件'};row.appendChild(remove);mark(item,item.invalid?'文件超过 300 MB，请移除':'等待上传',item.invalid?'error':'')});send.disabled=!items.some(function(i){return !i.invalid&&!i.done});$('clear').disabled=!items.length;retry.hidden=true;state.textContent='已加入 '+items.length+' / 200 个文件'+(overflow?'，超过数量上限的文件未加入':'')}
input.onchange=function(){if(running)return;append(input.files);input.value=''};
var directory=$('folder');if('webkitdirectory' in directory)$('chooseFolder').hidden=false;directory.onchange=function(){if(running)return;append(directory.files);directory.value=''};
$('clear').onclick=function(){if(running)return;items=[];queue.textContent='';send.disabled=true;retry.hidden=true;this.disabled=true;input.value='';state.textContent='队列已清空，可以重新添加文件'};
function run(){if(running||!items.length)return;running=true;send.disabled=true;input.disabled=true;directory.disabled=true;$('chooseFolder').classList.add('disabled');$('clear').disabled=true;Array.prototype.forEach.call(queue.querySelectorAll('.remove'),function(b){b.disabled=true});$('choose').classList.add('disabled');retry.hidden=true;var index=0;
function next(){while(index<items.length&&(items[index].done||items[index].invalid))index++;if(index>=items.length){running=false;input.disabled=false;directory.disabled=false;$('chooseFolder').classList.remove('disabled');$('clear').disabled=false;Array.prototype.forEach.call(queue.querySelectorAll('.remove'),function(b){b.disabled=false});$('choose').classList.remove('disabled');var done=items.filter(function(i){return i.done}).length,failed=items.filter(function(i){return !i.done&&!i.invalid}).length;state.textContent='已完成 '+done+' / '+items.length+' 个文件'+(failed?'，'+failed+' 个失败，可重试':'');retry.hidden=!failed;load();return}var item=items[index++],f=item.file,x=new XMLHttpRequest();item.bar.value=0;mark(item,'连接车机…');x.open('PUT','/upload?name='+encodeURIComponent(f.name));x.timeout=0;state.textContent='正在传输 '+index+' / '+items.length+' 个文件';x.upload.onprogress=function(e){if(e.lengthComputable){var p=Math.min(100,Math.round(e.loaded/e.total*100));item.bar.value=p;mark(item,p===100?'100% · 车机正在保存…':p+'% · '+size(e.loaded)+' / '+size(e.total))}};x.onload=function(){if(x.status===200){item.done=true;item.bar.value=100;mark(item,'✓ 已保存到车机','done')}else mark(item,'失败：'+(x.responseText||'HTTP '+x.status),'error');next()};x.onerror=function(){mark(item,'网络中断，连接恢复后可重试','error');next()};x.onabort=function(){mark(item,'已中断，可重试','error');next()};x.send(f)}next()}
send.onclick=run;retry.onclick=run;$('refresh').onclick=load;window.addEventListener('beforeunload',function(e){if(running){e.preventDefault();e.returnValue='文件仍在传输'}});load();
})();
</script></body></html>
